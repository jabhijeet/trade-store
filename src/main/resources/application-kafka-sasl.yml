# Kafka over SASL_SSL with SCRAM-SHA-512 credentials. Activate with SPRING_PROFILES_ACTIVE=kafka-sasl.
# Credentials and the trust store come from the environment and have no defaults. The protocol is fixed, so a
# missing secret makes the connection fail; it never falls back to an unauthenticated connection. Topic ACLs are set
# on the cluster; see docs/architecture.md, section 2.11.
spring:
  kafka:
    security:
      protocol: SASL_SSL
    properties:
      "[sasl.mechanism]": SCRAM-SHA-512
      "[sasl.jaas.config]": >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_LOCATION}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD}
      trust-store-type: PKCS12
